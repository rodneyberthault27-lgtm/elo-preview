<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carregando ficha Elo Preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3f0;
        color: #17201c;
        font-family: Arial, Helvetica, sans-serif;
      }

      .loading {
        width: min(92vw, 420px);
        border: 1px solid rgba(17, 130, 104, 0.14);
        border-radius: 14px;
        padding: 28px 24px;
        background: #fff;
        box-shadow: 0 18px 42px rgba(22, 31, 27, 0.08);
        text-align: center;
      }

      .loading strong {
        display: block;
        margin-bottom: 8px;
        font-size: 1.08rem;
      }

      .loading p {
        margin: 0;
        color: #68746f;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="loading">
      <strong>Preparando a ficha</strong>
      <p>Se nada abrir em alguns segundos, volte para a tela anterior e gere a ficha novamente.</p>
    </div>

    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const sheetKey = params.get("sheet");
        const content =
          (sheetKey ? window.localStorage.getItem(sheetKey) : "") || window.localStorage.getItem("elo-approval-sheet:last") || "";

        if (!content) {
          document.querySelector(".loading").innerHTML =
            "<strong>Ficha indisponivel</strong><p>Essa previa expirou ou nao foi gerada corretamente. Volte ao Elo Preview e gere a ficha novamente.</p>";
          return;
        }

        document.open();
        document.write(content);
        document.close();
      })();
    </script>
  </body>
</html>
